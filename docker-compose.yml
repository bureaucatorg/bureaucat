services:
  landing:
    image: oven/bun:1.3.7-slim
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./landing:/app
    command: sh -c "bun install && bun run dev --host 0.0.0.0"
    ports:
      - 127.0.0.1:3042:3042
    environment:
      VITE_APP_URL: http://localhost:1341

  app:
    restart: unless-stopped
    build:
      context: ./
      dockerfile: Dockerfile.dev
    volumes:
      - ./:/app
    working_dir: /app
    ports:
      - 127.0.0.1:1341:1341
    depends_on:
      postgres:
        condition: service_healthy
      garage:
        condition: service_healthy
    env_file:
      - .env

  garage-webui:
    image: khairul169/garage-webui:1.1.0
    container_name: bureaucat-garage-webui
    restart: unless-stopped
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
    ports:
      - 127.0.0.1:3909:3909
    depends_on:
      garage:
        condition: service_healthy
    environment:
      API_BASE_URL: "http://garage:3903"
      S3_ENDPOINT_URL: "http://garage:3900"

  garage:
    image: dxflrs/garage:v2.2.0
    restart: unless-stopped
    container_name: bureaucat-garage
    ports:
      - 127.0.0.1:3900:3900 # S3 API
      - 127.0.0.1:3903:3903 # admin API
    volumes:
      - ./garage/garage.toml:/etc/garage.toml
      - ./garage/meta:/var/lib/garage/meta
      - ./garage/data:/var/lib/garage/data
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.31.3
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - /tmp/mailpit/data:/data
      - ./mailpit-certs:/certs:ro
    ports:
      - 127.0.0.1:8025:8025
      - 127.0.0.1:1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
      MP_SMTP_TLS_CERT: /certs/mailpit.crt
      MP_SMTP_TLS_KEY: /certs/mailpit.key

  pgweb:
    image: sosedoff/pgweb:0.17.0
    env_file:
      - .pgweb.env
    ports:
      - 127.0.0.1:8083:8081
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "nc", "-vz", "127.0.0.1", "8081"]
      interval: 5s

  postgres:
    image: postgres:18.1-alpine3.23
    restart: unless-stopped
    volumes:
      - ./postgres-data:/var/lib/postgresql/18/docker
    env_file:
      - .postgres.env
    healthcheck:
      test: "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""
      interval: 10s
      timeout: 5s
      retries: 5
